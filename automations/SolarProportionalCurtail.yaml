alias: Proportional solar curtailment (hold export near zero at negative price)
description: >-
  When export price is negative, curtail solar ONLY to the extent that we are
  actually EXPORTING past input_number.solar_curtail_target_kw. If we are not
  exporting, solar is allowed to ramp up so the surplus charges the battery (at
  any SOC) or serves the house — it is not thrown away. Curtailment therefore
  kicks in only when the battery is full (surplus exports) or when surplus
  exceeds the battery's charge rate (~5 kW). Restores 100% when price is
  non-negative.

  REPLACES the binary "Fallback hard-curtail" automation — disable that one so
  the two don't both write the inverter limit registers.
triggers:
  - trigger: time_pattern
    seconds: "/20"
conditions:
  # Yield to the manual emergency override so the two paths don't fight the
  # inverter limit registers.
  - condition: state
    entity_id: input_boolean.manual_full_curtail
    state: "off"
mode: single
actions:
  - variables:
      price: "{{ states('sensor.power_sync_current_export_price') | float(0) }}"
      # Smoothed grid power (1-min rolling mean) rejects CT noise near zero;
      # falls back to the raw value if the statistics sensor isn't ready yet.
      grid: "{{ states('sensor.grid_power_smoothed') | float(states('sensor.power_sync_grid_power') | float(0)) }}"
      # Battery power: POSITIVE = discharging, negative = charging (confirmed).
      bat: "{{ states('sensor.power_sync_battery_power') | float(0) }}"
      # Battery state of charge (%) — gates the upward ramp: below full_soc the
      # loop lets solar rise so the surplus charges the battery.
      soc: "{{ states('sensor.power_sync_battery_level') | float(0) }}"
      target: "{{ states('input_number.solar_curtail_target_kw') | float(-0.1) }}"
      limit: "{{ states('input_number.solar_curtail_limit') | float(100) }}"
      # Minimum commanded limit (%). Never drive the inverters below this while
      # curtailing. The Sungrow SHUTS DOWN at 0% (ratio=0) and takes minutes to
      # restart; on the way back the Fronius has already over-ramped to cover
      # the load, so recovery causes a big export spike. Holding ~5% (~250 W
      # each) keeps both inverters actively generating so neither drops out.
      # The house baseline load comfortably absorbs this floor.
      min_limit: 5
      # Battery is treated as "full" (no charging headroom) at/above this SOC %.
      # Below it, the loop lets solar ramp so surplus charges the battery rather
      # than being curtailed.
      full_soc: 99
      # Asymmetric ramp tuning (only applies while curtailing at negative price).
      #  DOWN = reducing solar because we're exporting past target -> AGGRESSIVE,
      #         so unwanted export is killed fast.
      #  UP   = increasing solar because house load rose / battery is discharging
      #         -> GENTLE, because the battery absorbs the short-term load, so we
      #         don't need to chase transient loads (e.g. the microwave) and avoid
      #         nervous hunting. When price returns >= 0 the release branch snaps
      #         straight to 100%, so this gentle up-ramp only affects curtailment.
      down_gain: 25    # %/kW step when DECREASING solar
      down_cap: 40     # max % down-step per 20 s tick
      up_gain: 8       # %/kW step when INCREASING solar
      # up_cap raised 8 -> 25 after measuring 116 min of live operation.
      #
      # PROBLEM: with up_gain 8 and up_cap 8, ANY deficit of 1 kW or more
      # saturated the cap, so the proportional term was effectively dead and the
      # loop was a flat 8%/tick ramp no matter how far behind it was. Meanwhile
      # down_cap is 40, so one export blip knocked the limit down 40 points and
      # took five ticks to climb back. Under broken cloud (solar swung 9503 W to
      # 1596 W inside a minute) it spent most of its time recovering:
      #   73% of samples had somewhere for the energy to go - not exporting,
      #      battery below full - yet the mean commanded limit was 40.6%
      #   40% of those had the battery actively DRAINING, i.e. pure waste
      #   63.6% of drain time sat at a limit below 50%, vs only 25% at a maxed
      #      100% where cloud was the real constraint
      #
      # ECONOMICS: the down-ramp was defending the cheap side of a lopsided
      # trade. Avoided export was worth -0.58 c/kWh; the solar being discarded
      # displaces import at +2.60 c/kWh (4x, and far worse at normal evening
      # rates). Total export actually incurred over those 116 min was 0.111 kWh
      # = 0.06 CENTS, against multiple kWh of unharvested solar.
      #
      # 25 restores proportionality: a 1 kW deficit now steps 8%, 2 kW steps 16%,
      # and only beyond ~3.1 kW does the cap bind. Recovery from a cloud takes
      # one or two ticks instead of five. Hunting was already mild at 0.3
      # reversals/min, so there is headroom to be less timid.
      up_cap: 25       # max % up-step per 20 s tick
  - choose:
      # ---------------- CURTAIL: negative export price ----------------
      - conditions:
          - condition: template
            value_template: "{{ price < 0 }}"
        sequence:
          - variables:
              # Export-limiter error. err = grid - target:
              #   +ve => importing / under the export target (room for more solar)
              #   -ve => exporting beyond target
              err: "{{ grid - target }}"
              # Is the battery actively soaking up surplus WITH room to take more?
              #   charging (bat < -0.1), below its ~5 kW max charge rate
              #   (bat > -4.8), and not full (soc < full_soc). bat is +ve when
              #   discharging, -ve when charging. When this is true, any marginal
              #   "export" is CT noise or a brief transient the battery will
              #   absorb — so we must NOT trim solar; ramp toward 100% instead.
              #   (Fixes the loop getting pinned in the ~70s% by noise around
              #   grid=0 while the battery still had headroom to charge faster.)
              battery_absorbing: "{{ bat < -0.1 and bat > -4.8 and soc < full_soc }}"
              # Battery actively DISCHARGING while we are curtailing. This is
              # unambiguously wasteful: the house is being fed from stored energy
              # while free solar is being thrown away, so more solar is strictly
              # better and CANNOT cause export - the extra generation displaces
              # the discharge long before it reaches the grid.
              #
              # WITHOUT THIS TERM THE LOOP HAS A STABLE TRAP. Observed live at
              # soc 81%, negative price, limit pinned at 5%: solar 0.55 kW, load
              # 1.64 kW, battery discharging 1.22 kW, grid 0.03 kW. The loop only
              # watched GRID power, and grid sits near zero precisely BECAUSE the
              # battery is covering the shortfall - so err was -0.05, which fails
              # `err < -0.05` (not strictly less) and fails `err > 0.05`, landing
              # in HOLD forever. With target 0.05, ANY grid value between 0 and
              # +0.10 kW parks the loop, and grid_power_smoothed reads exactly 0.0
              # when the CT hovers around zero.
              battery_draining: "{{ bat > 0.1 }}"
              # Asymmetric proportional steps (see tuning knobs above):
              #   down_step: aggressive (high gain/cap) to stop export fast.
              #   up_step:   gentle (low gain/cap); battery/house absorb the rest.
              down_step: "{{ [down_cap, [2, (err | abs) * down_gain] | max] | min }}"
              # Size the UP step from the LARGER of the two deficit signals:
              #   |err|  - how far the grid is from the export target
              #   bat    - how hard the battery is discharging (when it is)
              # Without the battery term the step collapses to the 1% minimum in
              # exactly the case that matters most: while the battery covers the
              # house the grid sits near target, so |err| is tiny even though the
              # real deficit is kilowatts. Measured on the live fault that gave
              # 1%/tick = 31 MINUTES to walk 5% -> 100% while discharging 1.2 kW.
              # Using bat instead gives 8%/tick, so ~4 minutes.
              # For bat <= 0 this is identical to the old expression, so charging,
              # export and import behaviour are untouched.
              deficit: "{{ [ (err | abs), ([0, bat] | max) ] | max }}"
              up_step: "{{ [up_cap, [1, deficit * up_gain] | max] | min }}"
              # Decision:
              #   CURTAIL only when EXPORTING (err < -0.05) AND the battery can't
              #     take the surplus — i.e. full, at its ~5 kW charge ceiling, or
              #     not charging at all (idle/held). That is REAL export: battery
              #     full = scenario 1, surplus > battery charge rate = scenario 2.
              #   RAMP UP toward 100% when the battery is absorbing with room, OR
              #     we're importing — so surplus charges the battery fast and CT
              #     noise near zero never trims a healthy charge.
              #   HOLD only when the battery can't absorb AND we're at the
              #     no-export edge (prevents hunting once the battery is full).
              #   Note battery_draining appears in BOTH branches: it blocks the
              #   DOWN step as well as forcing UP. Trimming solar while the
              #   battery is discharging can never be correct, so even if CT noise
              #   momentarily reads as export we must not act on it.
              newlimit: >-
                {% if err < -0.05 and not battery_absorbing and not battery_draining %}{{ [min_limit, (limit - down_step)] | max }}
                {% elif battery_absorbing or battery_draining or err > 0.05 %}{{ [100, (limit + up_step)] | min }}
                {% else %}{{ limit }}{% endif %}
          - action: input_number.set_value
            target:
              entity_id: input_number.solar_curtail_limit
            data:
              value: "{{ newlimit }}"
          # --- Fronius: WMaxLimPct = limit% x 100. Enable the limiter (Ena=1)
          #     ONLY when actually reducing (newlimit < 100). At 100% we set
          #     Ena=0, because the Fronius reports St=5 (Throttled) whenever the
          #     limiter is armed — even at 100% — which showed a PHANTOM throttle
          #     during negative-price windows that weren't trimming anything.
          #     Now Ena tracks "are we really curtailing" exactly.
          - action: modbus.write_register
            data:
              hub: fronius_inverter
              slave: 1
              address: 40232
              value: "{{ (newlimit | float(100) * 100) | int }}"
          - action: modbus.write_register
            data:
              hub: fronius_inverter
              slave: 1
              address: 40236
              value: "{{ 1 if (newlimit | float(100)) < 100 else 0 }}"
          # --- Sungrow: ratio = limit% x 10, ensure limiter enabled ---
          - action: modbus.write_register
            data:
              hub: sungrow_inverter
              slave: 1
              address: 5007
              value: "{{ (newlimit | float(100) * 10) | int }}"
          - action: modbus.write_register
            data:
              hub: sungrow_inverter
              slave: 1
              address: 5006
              value: 170
    # ---------------- RELEASE: price >= 0, restore 100% once ----------------
    default:
      # Release when EITHER the commanded limit is below 100 OR the Fronius
      # limiter is still ARMED (WMaxLim_Ena == 1). The Ena check is critical:
      # a brief negative-price tick can leave Ena=1 at 100%, and the Fronius
      # reports St=5 (Throttled) whenever Ena=1 — even though no power is lost.
      # Gating only on "limit < 100" never cleared that, so the inverter sat in
      # a PHANTOM throttle indefinitely. (Confirmed by SunSpec test: writing
      # Ena=0 flips St 5 -> 4 immediately.) This self-heals within one tick.
      - condition: template
        value_template: >-
          {{ (limit < 100)
             or (states('sensor.fronius_curtailment_enabled') | int(0) == 1) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.solar_curtail_limit
        data:
          value: 100
      - action: modbus.write_register
        data:
          hub: fronius_inverter
          slave: 1
          address: 40232
          value: 10000
      - action: modbus.write_register
        data:
          hub: fronius_inverter
          slave: 1
          address: 40236
          value: 0
      - action: modbus.write_register
        data:
          hub: sungrow_inverter
          slave: 1
          address: 5007
          value: 1000
