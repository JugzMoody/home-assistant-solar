alias: Proportional solar curtailment (hold export near zero at negative price)
description: >-
  When export price is negative, curtail solar ONLY to the extent that we are
  actually EXPORTING past input_number.solar_curtail_target_kw. If we are not
  exporting, solar is allowed to ramp up so the surplus charges the battery (at
  any SOC) or serves the house — it is not thrown away. Curtailment therefore
  kicks in only when the battery is full (surplus exports) or when surplus
  exceeds the battery's charge rate (~5 kW). Restores 100% when price is
  non-negative.

  REPLACES the binary "Fallback hard-curtail" automation — disable that one so
  the two don't both write the inverter limit registers.
triggers:
  - trigger: time_pattern
    seconds: "/20"
conditions:
  # Yield to the manual emergency override so the two paths don't fight the
  # inverter limit registers.
  - condition: state
    entity_id: input_boolean.manual_full_curtail
    state: "off"
mode: single
actions:
  - variables:
      price: "{{ states('sensor.power_sync_current_export_price') | float(0) }}"
      # Smoothed grid power (1-min rolling mean) rejects CT noise near zero;
      # falls back to the raw value if the statistics sensor isn't ready yet.
      grid: "{{ states('sensor.grid_power_smoothed') | float(states('sensor.power_sync_grid_power') | float(0)) }}"
      # Battery power: POSITIVE = discharging, negative = charging (confirmed).
      bat: "{{ states('sensor.power_sync_battery_power') | float(0) }}"
      # Battery state of charge (%) — gates the upward ramp: below full_soc the
      # loop lets solar rise so the surplus charges the battery.
      soc: "{{ states('sensor.power_sync_battery_level') | float(0) }}"
      target: "{{ states('input_number.solar_curtail_target_kw') | float(-0.1) }}"
      limit: "{{ states('input_number.solar_curtail_limit') | float(100) }}"
      # Minimum commanded limit (%). Never drive the inverters below this while
      # curtailing. The Sungrow SHUTS DOWN at 0% (ratio=0) and takes minutes to
      # restart; on the way back the Fronius has already over-ramped to cover
      # the load, so recovery causes a big export spike. Holding ~5% (~250 W
      # each) keeps both inverters actively generating so neither drops out.
      # The house baseline load comfortably absorbs this floor.
      min_limit: 5
      # Battery is treated as "full" (no charging headroom) at/above this SOC %.
      # Below it, the loop lets solar ramp so surplus charges the battery rather
      # than being curtailed.
      full_soc: 99
      # Asymmetric ramp tuning (only applies while curtailing at negative price).
      #  DOWN = reducing solar because we're exporting past target -> AGGRESSIVE,
      #         so unwanted export is killed fast.
      #  UP   = increasing solar because house load rose / battery is discharging
      #         -> GENTLE, because the battery absorbs the short-term load, so we
      #         don't need to chase transient loads (e.g. the microwave) and avoid
      #         nervous hunting. When price returns >= 0 the release branch snaps
      #         straight to 100%, so this gentle up-ramp only affects curtailment.
      down_gain: 25    # %/kW step when DECREASING solar
      down_cap: 40     # max % down-step per 20 s tick
      up_gain: 8       # %/kW step when INCREASING solar
      up_cap: 8        # max % up-step per 20 s tick
  - choose:
      # ---------------- CURTAIL: negative export price ----------------
      - conditions:
          - condition: template
            value_template: "{{ price < 0 }}"
        sequence:
          - variables:
              # Export-limiter error. err = grid - target:
              #   +ve => importing / under the export target (room for more solar)
              #   -ve => exporting beyond target (must trim)
              # No battery term: the release-biased branch below (ramp up UNLESS
              # actually exporting) lets the battery charge from surplus at any
              # SOC, and self-heals the old "trapped at zero while the battery
              # discharges" failure — so the previous max(0,bat) hack is gone.
              err: "{{ grid - target }}"
              # Asymmetric proportional steps (see tuning knobs above):
              #   down_step: aggressive (high gain/cap) to stop export fast.
              #   up_step:   gentle (low gain/cap); battery/house absorb the rest.
              down_step: "{{ [down_cap, [2, (err | abs) * down_gain] | max] | min }}"
              up_step: "{{ [up_cap, [1, (err | abs) * up_gain] | max] | min }}"
              # Release-biased decision (deadband 0.05 kW; 30 s grid smoothing
              # keeps noise below it):
              #   EXPORTING (err < -0.05)  -> curtail (aggressive down-ramp).
              #   else, if IMPORTING (err > 0.05) OR the battery still has room
              #     (soc < full_soc) OR it is DISCHARGING (bat > 0.1)
              #                            -> ramp up so the surplus goes into the
              #                               house/battery (this is what charges
              #                               a low battery instead of curtailing).
              #   else (battery full & sitting at the no-export edge) -> hold.
              # Net: curtails ONLY real export — battery full (scenario 1) or
              # surplus > battery charge rate (scenario 2, any SOC) — never just
              # because the battery is charging.
              newlimit: >-
                {% if err < -0.05 %}{{ [min_limit, (limit - down_step)] | max }}
                {% elif err > 0.05 or soc < full_soc or bat > 0.1 %}{{ [100, (limit + up_step)] | min }}
                {% else %}{{ limit }}{% endif %}
          - action: input_number.set_value
            target:
              entity_id: input_number.solar_curtail_limit
            data:
              value: "{{ newlimit }}"
          # --- Fronius: WMaxLimPct = limit% x 100. Enable the limiter (Ena=1)
          #     ONLY when actually reducing (newlimit < 100). At 100% we set
          #     Ena=0, because the Fronius reports St=5 (Throttled) whenever the
          #     limiter is armed — even at 100% — which showed a PHANTOM throttle
          #     during negative-price windows that weren't trimming anything.
          #     Now Ena tracks "are we really curtailing" exactly.
          - action: modbus.write_register
            data:
              hub: fronius_inverter
              slave: 1
              address: 40232
              value: "{{ (newlimit | float(100) * 100) | int }}"
          - action: modbus.write_register
            data:
              hub: fronius_inverter
              slave: 1
              address: 40236
              value: "{{ 1 if (newlimit | float(100)) < 100 else 0 }}"
          # --- Sungrow: ratio = limit% x 10, ensure limiter enabled ---
          - action: modbus.write_register
            data:
              hub: sungrow_inverter
              slave: 1
              address: 5007
              value: "{{ (newlimit | float(100) * 10) | int }}"
          - action: modbus.write_register
            data:
              hub: sungrow_inverter
              slave: 1
              address: 5006
              value: 170
    # ---------------- RELEASE: price >= 0, restore 100% once ----------------
    default:
      # Release when EITHER the commanded limit is below 100 OR the Fronius
      # limiter is still ARMED (WMaxLim_Ena == 1). The Ena check is critical:
      # a brief negative-price tick can leave Ena=1 at 100%, and the Fronius
      # reports St=5 (Throttled) whenever Ena=1 — even though no power is lost.
      # Gating only on "limit < 100" never cleared that, so the inverter sat in
      # a PHANTOM throttle indefinitely. (Confirmed by SunSpec test: writing
      # Ena=0 flips St 5 -> 4 immediately.) This self-heals within one tick.
      - condition: template
        value_template: >-
          {{ (limit < 100)
             or (states('sensor.fronius_curtailment_enabled') | int(0) == 1) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.solar_curtail_limit
        data:
          value: 100
      - action: modbus.write_register
        data:
          hub: fronius_inverter
          slave: 1
          address: 40232
          value: 10000
      - action: modbus.write_register
        data:
          hub: fronius_inverter
          slave: 1
          address: 40236
          value: 0
      - action: modbus.write_register
        data:
          hub: sungrow_inverter
          slave: 1
          address: 5007
          value: 1000
