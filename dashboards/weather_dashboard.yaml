title: Weather Station
# ============================================================================
# ECOWITT HP2564 KITCHEN DISPLAY
# Target: PORTRAIT monitor (~1080x1920), always-on, glanceable from across the
# room, and NO SCROLLING (verified at exactly 1920px).
#
# Layout: type: sections with max_columns: 2.
#   - 1 column was too tall (3812px vs a 1920px viewport = ~50% visible).
#   - Sections flow row-by-row across the columns, so a SHORT section paired
#     with a TALL one leaves dead space. Order pairs similar heights:
#         row 1: Right Now      + Sun & UV        (both short)
#         row 2: Storm Watch    + Wind            (both tall)
#         row 3: Temperature    + Rain            (both medium)
#         row 4: Forecast       + Station Health  (medium + short, last)
#   - Cards carry their own `title:` instead of `heading:` cards, for
#     compatibility with older HA versions.
#
# READABILITY (needs the card-mod HACS plugin):
#   Glance cards default to small state text with a lot of padding. Every
#   glance below uses the same card_mod recipe:
#     * state value  -> 30px, bold  (the number you read from 3 m away)
#     * entity name  -> 15px, muted (a label, not the point)
#     * card header  -> 24px
#   Icons are hidden (`show_icon: false`) on the pure-data glances because they
#   were REDUNDANT and costly: e.g. Rainfall Totals showed four identical cloud
#   icons, consuming a row of height while conveying nothing. Dropping them
#   buys back the height that the larger type consumes.
# ============================================================================
views:
  - title: Weather Station
    path: weather_station
    type: sections
    max_columns: 2
    sections:
      # ======================================================================
      # ROW 1a - RIGHT NOW. The hero card: most important to read at distance.
      # The two rain tiles (Raining? / Rain Rate) were folded in here as
      # entities 5 and 6 - as separate tile cards they added two more card
      # borders and padding blocks for two small values.
      # 3 columns x 2 rows keeps the numbers large.
      # ======================================================================
      - type: grid
        cards:
          - type: glance
            title: Right Now
            show_name: true
            show_state: true
            show_icon: false
            columns: 3
            entities:
              - entity: sensor.hp2564ca_pro_v2_1_4_feels_like_temperature
                name: Feels Like
              - entity: sensor.hp2564ca_pro_v2_1_4_outdoor_temperature
                name: Actual
              - entity: sensor.hp2564ca_pro_v2_1_4_humidity
                name: Humidity
              - entity: sensor.hp2564ca_pro_v2_1_4_wind_gust
                name: Gust
              - entity: binary_sensor.hp2564ca_pro_v2_1_4_rain_state_piezo
                name: Raining?
              - entity: sensor.hp2564ca_pro_v2_1_4_rain_rate_piezo
                name: Rain Rate
            card_mod:
              # IMPORTANT: in this HA version each glance `div.entity` has its
              # OWN shadow root containing `div.name` (label) and a bare `div`
              # (the value). A selector written from the card's root therefore
              # CANNOT reach them - verified by DOM inspection. The `$` suffix
              # is card-mod's shadow-root piercing syntax; `.` targets the card.
              style:
                .entity$: |
                  .name {
                    font-size: 16px !important;
                    color: var(--secondary-text-color) !important;
                  }
                  div:not(.name) {
                    /* 34px truncated ("19.3...") in a 3-col ~120px cell.
                       26px fits "19.3 °C" / "0.0 mm/h" without ellipsis. */
                    font-size: 26px !important;
                    font-weight: 700 !important;
                    line-height: 1.25 !important;
                    white-space: nowrap !important;
                  }
                # Rain Rate is the last cell and its value ("0.0 mm/h") is the
                # widest string on the card - it still clipped at 26px (needed
                # 113px in a 102px cell). Shrink ONLY that cell rather than
                # dropping the whole hero card down a size for one outlier.
                .entity:last-child$: |
                  div:not(.name) {
                    font-size: 21px !important;
                  }
                .: |
                  ha-card {
                    --ha-card-header-font-size: 26px;
                  }

      # ======================================================================
      # ROW 1b - SUN / UV (short, pairs with Right Now)
      # ======================================================================
      - type: grid
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.hp2564ca_pro_v2_1_4_uv_index
                name: UV Index
                min: 0
                max: 11
                needle: true
                # FIXED: removed 'amber: 6' - the HA gauge card only accepts
                # green / yellow / red severity keys; 'amber' was invalid.
                severity:
                  green: 0
                  yellow: 3
                  red: 8
              # ================================================================
              # "CAN I RUN THE WASHING MACHINE?" traffic light.
              # Replaced the Solar Radiation gauge (not useful day-to-day).
              #
              # All logic now lives in sensor.free_power_advice (see the "FREE
              # POWER ADVISOR" section of configuration.yaml). This card only
              # maps its slug to a headline, a line of detail and a colour.
              #
              # It was originally computed inline here, but a dashboard template
              # is stateless - it re-renders from current state with no memory -
              # so it could not do the sustain/hysteresis needed to stop the
              # light flickering. Replaying 2026-09-16 through the inline version
              # gave 67 colour changes in one day, 42 under 5 minutes. The
              # backing sensors now smooth over 5 min and require a tier to hold
              # for 3 min, which measured 18 changes and zero sub-5-min flashes.
              #
              # Expect the light to lag reality by roughly 3-4 minutes. That is
              # the deliberate cost of not flickering.
              # ================================================================
              - type: markdown
                content: |-
                  {% set advice = states('sensor.free_power_advice') %}
                  {% set spare = state_attr('sensor.free_power_advice', 'spare_kw') | float(0) %}
                  {% set heads = {'yes_curtailed': 'YES', 'yes': 'YES', 'a_little_saving': 'A LITTLE', 'a_little': 'A LITTLE', 'on_battery': 'On Battery', 'not_now': 'NOT NOW'} %}
                  {% set details = {'yes_curtailed': 'Loads of spare - panels throttled back', 'yes': (spare | round(1)) ~ ' kW spare right now', 'a_little_saving': 'Saving charge for tonight', 'a_little': (spare | round(1)) ~ ' kW spare - small things only', 'on_battery': '', 'not_now': 'House is using it all'} %}
                  # {{ heads.get(advice, 'NOT NOW') }}
                  {{ details.get(advice, 'Waiting for data') }}
                card_mod:
                  # Colour is a straight slug -> hex lookup. The thresholds and
                  # tier logic live ONLY in sensor.free_power_advice, so there is
                  # nothing to keep in sync here any more (card-mod styles are
                  # evaluated separately from card content, which is why the old
                  # version had to duplicate the whole calculation).
                  style: >-
                    {% set advice = states('sensor.free_power_advice') %}
                    {% set colours = {'yes_curtailed': '#2e7d32', 'yes': '#2e7d32', 'a_little_saving': '#f9a825', 'a_little': '#f9a825', 'on_battery': '#c62828', 'not_now': '#c62828'} %}
                    {% set bg = colours.get(advice, '#c62828') %}
                    ha-card {
                      background: {{ bg }} !important;
                      border: none !important;
                      text-align: center !important;
                      color: #ffffff !important;
                      /* Vertically centre the text: the card is stretched to
                         match the UV gauge beside it, so without this the
                         status sits at the top with dead space underneath.
                         height:100% makes the card fill its grid cell, then
                         flex centring positions the content in the middle. */
                      height: 100% !important;
                      box-sizing: border-box !important;
                      display: flex !important;
                      flex-direction: column !important;
                      justify-content: center !important;
                      align-items: center !important;
                    }
                    ha-card h1 {
                      /* 32px, not 40px: "A LITTLE" (8 chars) wrapped at 40px in
                         this narrow half-column card. */
                      font-size: 32px !important;
                      font-weight: 800 !important;
                      line-height: 1.15 !important;
                      margin: 2px 0 6px 0 !important;
                      border-bottom: none !important;
                      color: #ffffff !important;
                    }
                    ha-card p {
                      font-size: 16px !important;
                      line-height: 1.3 !important;
                      margin: 0 !important;
                      color: #ffffff !important;
                    }

      # ======================================================================
      # ROW 2a - STORM WATCH: lightning proximity, activity, last event.
      # ======================================================================
      - type: grid
        cards:
          # Uses sensor.live_lightning_distance (configuration.yaml), NOT the
          # raw station distance: the station HOLDS the last strike distance
          # indefinitely (it read 6 km from a strike 8 days ago), which would
          # leave this bar permanently red. The template sensor pins to 40 km
          # unless a strike landed in the last 30 min.
          - type: custom:sensor-bar-card-plus
            title: ⚡ LIVE STORM INBOUND PROXIMITY
            entity: sensor.live_lightning_distance
            # Override the entity's friendly name ("Live Lightning Distance"),
            # which truncated to "Live Lightni..." in this narrow column.
            name: Lightning
            min: 40
            max: 0
            invert_direction: false
            icon: mdi:home-lightning-bolt
            unit: km away
            severity:
              - from: 25.1
                to: 40
                color: '#ffeb3b'
              - from: 10.1
                to: 25
                color: '#ff9800'
              - from: 0
                to: 10
                color: '#f44336'
          - type: custom:mini-graph-card
            title: Lightning Strike Activity (24h)
            entities:
              - entity: sensor.hp2564ca_pro_v2_1_4_lightning_strikes
                name: Strikes / hour
                color: '#ffeb3b'
            hours_to_show: 24
            height: 70
            # Scale the big state number up for distance reading (percentage of
            # the card's base font size).
            font_size: 140
            # The station's strike counter is CUMULATIVE (resets daily), so
            # aggregate_func: max drew a rising staircase of the running total
            # rather than activity. `delta` gives strikes-per-hour = real
            # activity.
            aggregate_func: delta
            group_by: hour
            # SOFT upper bound ('~'): keeps the axis at 10 so an all-zero day
            # renders as a sensible flat line instead of a stack of tiny blips
            # at the bottom, BUT still expands if a storm exceeds 10/hour (a
            # hard `upper_bound: 10` would clip the peak of a real storm).
            # Must be QUOTED - bare ~10 risks parsing as YAML null.
            lower_bound: 0
            upper_bound: '~10'
            show:
              graph: line
              fill: false
              icon: true
              legend: false
              extrema: false
              labels: false
          # An `entity` card here truncated badly in a narrow column ("Last
          # Detected ..." / "Septemb..."), because the raw state is a full
          # datetime. Relative time ("8 days ago") is both shorter AND more
          # glanceable from across the kitchen.
          - type: markdown
            content: >-
              {% set s = states('sensor.hp2564ca_pro_v2_1_4_last_lightning_strike') %}
              ⏱️ **Last strike:**
              {% if s not in ['unknown', 'unavailable', 'None'] %}
              {{ relative_time(as_datetime(s)) }} ago
              {% else %}
              none recorded
              {% endif %}
            card_mod:
              style: |
                ha-card {
                  font-size: 20px !important;
                }
          # Moved here from the Wind section: after the barometer was removed,
          # this (left) column was ~260px SHORTER than the windrose beside it,
          # leaving dead space. Parking Wind Detail here balances the row and
          # shortens the overall page. It still sits visually alongside the
          # windrose.
          # Wind summary. Was a glance card (Speed / Gust Now / Max Today);
          # now markdown so wind direction can be templated from degrees into a
          # 16-point compass label. 'Gust Now' dropped - 'Right Now' shows Gust.
          # Direction uses the 10-MINUTE AVERAGE: the instantaneous
          # wind_direction sensor jitters too much to read at a glance.
          - type: markdown
            title: Wind
            content: |-
              {% set deg = states('sensor.hp2564ca_pro_v2_1_4_wind_direction_10m_avg') | float(-1) %}
              {% set dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE',
                             'S','SSW','SW','WSW','W','WNW','NW','NNW'] %}
              {% set compass = dirs[(((deg / 22.5) + 0.5) | int) % 16] if deg >= 0 else '--' %}
              | Speed | From | Max Today |
              |:-:|:-:|:-:|
              | {{ states('sensor.hp2564ca_pro_v2_1_4_wind_speed') | float(0) | round(1) }} kn | {{ compass }} | {{ states('sensor.hp2564ca_pro_v2_1_4_max_daily_gust') | float(0) | round(1) }} kn |
            card_mod:
              style:
                ha-markdown$: |
                  table {
                    width: 100% !important;
                    border-collapse: collapse !important;
                    margin: 0 !important;
                  }
                  /* Equal thirds + explicit centring so each value sits directly
                     under its heading. Markdown's ':-:' alignment hints are not
                     honoured by HA's renderer, so it must be set in CSS. */
                  th, td {
                    width: 33.33% !important;
                    text-align: center !important;
                    border: none !important;
                  }
                  th {
                    font-size: 15px !important;
                    font-weight: 400 !important;
                    color: var(--secondary-text-color) !important;
                    padding: 0 0 2px 0 !important;
                  }
                  td {
                    font-size: 28px !important;
                    font-weight: 700 !important;
                    padding: 0 !important;
                    white-space: nowrap !important;
                  }
                .: |
                  ha-card {
                    --ha-card-header-font-size: 24px;
                  }
      # ======================================================================
      # ROW 2b - RAIN RADAR (tall, pairs with Storm Watch)
      # ======================================================================
      - type: grid
        cards:
          # Windy.com radar embed, replacing the windrose. Wind detail is not
          # wanted day-to-day, and current speed / direction / gust already
          # appear in Right Now and in the Wind panel beside this.
          #
          # WHY WINDY AND NOT BOM DIRECTLY (all verified 2026-09-16):
          #  * custom:bom-radar-card is DEAD. It fetches
          #    api.weather.bom.gov.au/v1/radar/capabilities, which BOM retired in
          #    Dec 2024 and now returns HTTP 404. Re-confirmed still 404.
          #  * BOM's NEW radar service DOES work:
          #      api.bom.gov.au/apikey/v1/mapping/timeseries/wmts/1.0.0/
          #        atm_surf_air_precip_reflectivity_dbz/default/{time}/
          #        GoogleMapsCompatible_BoM/{z}/{row}/{col}.png
          #    but it needs a 'Referer: https://www.bom.gov.au/' header (404
          #    without it) and returns Access-Control-Allow-Origin set to that
          #    LITERAL origin, not '*'. A browser-side card therefore cannot read
          #    it at all - it needs a server-side proxy, WMTS tile maths, tile
          #    stitching and basemap compositing. See README + probe-bom-wmts.py.
          #  * Windy embeds with no API key, no container and no CORS problem:
          #    embed.windy.com sends no X-Frame-Options and no CSP
          #    frame-ancestors. Its Australian radar is the BOM national
          #    composite, so the underlying data is still BOM.
          #
          # zoom=8 spans roughly Gympie -> Warwick, enough upstream view to see
          # a system approaching. zoom=7 widens it if that proves too tight.
          # The kitchen display is NOT a touch screen, so Windy's own zoom and
          # play controls are inert decoration and the view stays fixed.
          #
          # NOTE: the embed opens on the CURRENT frame and does not animate
          # unless play is pressed, which nobody can do on a non-touch screen.
          # Treat this as a live still, not a loop.
          - type: iframe
            # HEIGHT: in a `sections` view the SECTION GRID row span controls the
            # height and `aspect_ratio` is IGNORED - measured on the live 1080px
            # portrait display, aspect_ratio: 105% produced a 248px tall card,
            # nowhere near 105% of the 364px column width. Use grid_options.rows.
            #
            # Row arithmetic: height = 64*rows - 8  (56px row + 8px gap)
            #   rows: 4 -> 248px   (the original, left ~300px of dead space)
            #   rows: 8 -> 504px   <- current, almost exactly double
            #   rows: 9 -> 568px   (overflows: see below)
            #
            # Why 8 and not 9: Storm Watch in the left column of this same row
            # measures 545px (top 300 -> 845). rows: 8 = 504px tucks inside that,
            # so the row band and the exact 1920px page fit are UNCHANGED and
            # nothing scrolls. rows: 9 = 568px would exceed the left column by
            # ~23px and push the whole page over 1920.
            #
            # A taller viewport does NOT distort the map. Windy is a live map,
            # not a fixed-ratio image, so extra height simply reveals more
            # north-south geography at the same zoom.
            grid_options:
              rows: 8
            url: >-
              https://embed.windy.com/embed2.html?lat=-27.33&lon=153.07&detailLat=-27.33&detailLon=153.07&zoom=8&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1
      # ======================================================================
      # ROW 3a - TEMPERATURE (medium)
      # ======================================================================
      - type: grid
        cards:
          # Outside temperature only - dewpoint removed (little practical value
          # in Brisbane). `show.extrema: true` adds the 24h HIGH/LOW badges
          # (with their timestamps) which is the "tag" we want; height 120 so
          # they have room. font_size scales the big current-value number.
          - type: custom:mini-graph-card
            title: 24h Outside Temperature
            hours_to_show: 24
            line_width: 3
            points_per_hour: 2
            height: 120
            font_size: 150
            entities:
              - entity: sensor.hp2564ca_pro_v2_1_4_outdoor_temperature
                name: Temp
                color: '#ff5722'
            show:
              graph: line
              fill: fade
              icon: true
              legend: false
              extrema: true
              labels: false
          # Inside vs outside - "should we open the windows?"
          - type: glance
            title: Inside vs Outside
            show_icon: false
            columns: 4
            entities:
              # Short labels: at 4 columns (~91px/cell) longer names ellipsised.
              - entity: sensor.hp2564ca_pro_v2_1_4_indoor_temperature
                name: In
              - entity: sensor.hp2564ca_pro_v2_1_4_outdoor_temperature
                name: Out
              - entity: sensor.hp2564ca_pro_v2_1_4_indoor_humidity
                name: In RH
              - entity: sensor.hp2564ca_pro_v2_1_4_humidity
                name: Out RH
            card_mod:
              style:
                .entity$: |
                  .name {
                    font-size: 15px !important;
                    color: var(--secondary-text-color) !important;
                  }
                  div:not(.name) {
                    /* 4 columns => ~91px cells; 22px keeps "23.2 °C" intact. */
                    font-size: 22px !important;
                    font-weight: 700 !important;
                    line-height: 1.25 !important;
                    white-space: nowrap !important;
                  }
                .: |
                  ha-card {
                    --ha-card-header-font-size: 24px;
                  }

      # ======================================================================
      # ROW 3b - RAIN (medium, pairs with Temperature)
      # ======================================================================
      - type: grid
        cards:
          - type: history-graph
            title: Rain Timeline & Total Accumulation
            hours_to_show: 24
            entities:
              # FIXED: was '..._hourly_rain_piexo' (typo) so this series never
              # rendered - the legend only ever showed the daily total.
              - entity: sensor.hp2564ca_pro_v2_1_4_hourly_rain_piezo
                name: Active Showers Timeline
              - entity: sensor.hp2564ca_pro_v2_1_4_daily_rain_piezo
                name: Day Total Accumulated
          # Rainfall context at a glance (garden / tank decisions). Icons hidden
          # - all four were the same cloud glyph, pure vertical padding.
          - type: glance
            title: Rainfall Totals
            show_icon: false
            columns: 4
            entities:
              # Short labels: "This Month" ellipsised to "This Mon..." at 4 cols.
              - entity: sensor.hp2564ca_pro_v2_1_4_24h_rain_piezo
                name: 24 h
              - entity: sensor.hp2564ca_pro_v2_1_4_weekly_rain_piezo
                name: Week
              - entity: sensor.hp2564ca_pro_v2_1_4_monthly_rain_piezo
                name: Month
              - entity: sensor.hp2564ca_pro_v2_1_4_yearly_rain_piezo
                name: Year
            card_mod:
              style:
                .entity$: |
                  .name {
                    font-size: 15px !important;
                    color: var(--secondary-text-color) !important;
                  }
                  div:not(.name) {
                    /* 19px, NOT the 22px used by Inside-vs-Outside. Despite
                       identical config and DOM metrics reporting no overflow,
                       these values ("0.0 mm") visibly ellipsised at 22px in
                       this column. Trust the rendered pixels over scrollWidth:
                       19px renders in full. */
                    font-size: 19px !important;
                    font-weight: 700 !important;
                    line-height: 1.25 !important;
                    white-space: nowrap !important;
                  }
                .: |
                  ha-card {
                    --ha-card-header-font-size: 24px;
                  }

      # ======================================================================
      # ROW 4a - FORECAST. Below the live data: the station's own readings are
      # what this display is for; the forecast is supporting context.
      # ======================================================================
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Local Weather Forecast
            show_current: true
            show_forecast: true
            secondary_info_attribute: humidity
            forecast_type: daily
            # This is a CORE HA card, and unlike the glance cards its whole tree
            # lives in ONE shadow root (no per-item nested roots), so plain
            # card-mod styles work - no '$' piercing needed.
            # NOTE: `div.temp` exists BOTH in the current-conditions block and in
            # each forecast item, so the two are scoped separately below.
            # Increases are kept modest: this card governs the height of the
            # final row, and the page has zero headroom at 1920px.
            card_mod:
              style: |
                .state {
                  font-size: 24px !important;
                  font-weight: 700 !important;
                }
                .name {
                  font-size: 15px !important;
                }
                .temp-attribute .temp {
                  font-size: 24px !important;
                  font-weight: 700 !important;
                }
                .attribute {
                  font-size: 15px !important;
                }
                .forecast-item-label {
                  font-size: 15px !important;
                  font-weight: 600 !important;
                }
                .forecast-item .temp {
                  font-size: 19px !important;
                  font-weight: 700 !important;
                }
                .forecast-item .templow {
                  font-size: 16px !important;
                }

      # ======================================================================
      # ROW 4b - SUN & MOON (replaced the Station Health glance).
      #
      # WHAT WAS REMOVED: Station Health showed WH57 (lightning sensor) and
      # WH90 (outdoor array) battery levels. That check still MATTERS - a flat
      # sensor battery makes the station silently report "no lightning / no
      # rain" instead of erroring - so it is better served by an ALERT than by
      # permanent dashboard space. See README.
      #
      # Built as markdown, not a glance, because:
      #   - the sun sensors are TIMESTAMPS (a glance renders them as "in 10
      #     hours", which is useless here), and
      #   - the moon state is snake_case ('waxing_crescent') and needs
      #     prettifying to 'Waxing Crescent'.
      #
      # SOUTHERN HEMISPHERE NOTE: the standard moon emoji are drawn for the
      # NORTHERN hemisphere (waxing = lit on the right). From Brisbane the moon
      # appears mirrored, so each waxing/waning glyph below is deliberately
      # swapped for its mirror image to match what you actually see.
      #
      # The sun sensors are 'next_rising'/'next_setting', so during the day
      # 'next rising' is technically tomorrow's - but sunrise shifts only ~1
      # min/day, so it is effectively today's time and fine for a glance panel.
      # ======================================================================
      - type: grid
        cards:
          - type: markdown
            title: Sun & Moon
            content: |-
              {% set rise = states('sensor.sun_next_rising') %}
              {% set set_ = states('sensor.sun_next_setting') %}
              {% set p = states('sensor.moon_phase') %}
              {% set em = {
                   'new_moon': '🌑',
                   'waxing_crescent': '🌘',
                   'first_quarter': '🌗',
                   'waxing_gibbous': '🌖',
                   'full_moon': '🌕',
                   'waning_gibbous': '🌔',
                   'last_quarter': '🌓',
                   'waning_crescent': '🌒' } %}
              # ↑ {{ as_timestamp(rise) | timestamp_custom('%H:%M') }}   ↓ {{ as_timestamp(set_) | timestamp_custom('%H:%M') }}
              ## {{ em.get(p, '🌙') }}
              {{ p | replace('_', ' ') | title }}
            card_mod:
              # The rendered markdown (h1/h2/p) lives inside ha-markdown's OWN
              # shadow root, so `ha-card h2` cannot reach it - that is why the
              # earlier rules did nothing. `ha-markdown$` pierces that boundary
              # (card-mod syntax); `.` targets the card itself.
              style:
                ha-markdown$: |
                  h1 {
                    /* sunrise / sunset times */
                    font-size: 30px !important;
                    font-weight: 700 !important;
                    line-height: 1.2 !important;
                    margin: 0 0 2px 0 !important;
                    border-bottom: none !important;
                    text-align: center !important;
                  }
                  h2 {
                    /* The moon glyph, alone on its line so it can be sized
                       independently. 80px (was 100px): at 100px with
                       line-height 1.0 the emoji's ascender overflowed its line
                       box upward and collided with the sunset arrow in the h1
                       above. Slightly looser line-height + a top margin keep it
                       clear. */
                    font-size: 80px !important;
