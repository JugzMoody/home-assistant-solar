title: Weather Station
views:
- title: Weather Station
  path: weather_station
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: clock
        clock_size: medium
        show_seconds: true
        time_format: '12'
      - type: markdown
        content: '{{ states(''sensor.date_time'').split('', '')[0] }}'
        card_mod:
          style: "ha-card {\n  height: 100% !important;\n  box-sizing: border-box !important;\n  display: flex !important;\n  flex-direction: column !important;\n  justify-content: center !important;\n  align-items: center !important;\n  text-align: center\
            \ !important;\n}\nha-markdown {\n  font-size: 22px !important;\n  font-weight: 700 !important;\n  line-height: 1.3 !important;\n}\n"
    - type: weather-forecast
      entity: weather.forecast_home
      name: Local Weather Forecast
      show_current: true
      show_forecast: true
      secondary_info_attribute: humidity
      forecast_type: daily
      card_mod:
        style: ".state {\n  font-size: 24px !important;\n  font-weight: 700 !important;\n}\n.name {\n  font-size: 15px !important;\n}\n.temp-attribute .temp {\n  font-size: 24px !important;\n  font-weight: 700 !important;\n}\n.attribute {\n  font-size:\
          \ 15px !important;\n}\n.forecast-item-label {\n  font-size: 15px !important;\n  font-weight: 600 !important;\n}\n.forecast-item .temp {\n  font-size: 19px !important;\n  font-weight: 700 !important;\n}\n.forecast-item .templow {\n  font-size:\
          \ 16px !important;\n}\n"
  - type: grid
    cards:
    - type: grid
      columns: 1
      square: false
      cards:
      - type: custom:canvas-gauge-card
        entity: sensor.free_power_score
        card_height: 300
        gauge:
          type: radial-gauge
          title: Free Power
          width: 340
          height: 340
          units: kW
          minValue: -8
          maxValue: 10
          majorTicks:
          - '-8'
          - '-6'
          - '-4'
          - '-2'
          - '0'
          - '2'
          - '4'
          - '6'
          - '8'
          - '10'
          minorTicks: 2
          strokeTicks: true
          highlights:
          - from: -8
            to: 0
            color: rgba(192,57,43,0.75)
          - from: 0
            to: 1
            color: rgba(243,156,18,0.75)
          - from: 1
            to: 3
            color: rgba(82,196,26,0.75)
          - from: 3
            to: 6
            color: rgba(56,158,13,0.75)
          - from: 6
            to: 10
            color: rgba(35,120,4,0.75)
          colorPlate: '#222'
          colorMajorTicks: '#f5f5f5'
          colorMinorTicks: '#ddd'
          colorTitle: '#fff'
          colorUnits: '#ccc'
          colorNumbers: '#eee'
          colorNeedle: rgba(240,128,128,1)
          colorNeedleEnd: rgba(255,160,122,.9)
          valueBox: true
          valueBoxStroke: 5
          valueBoxWidth: 60
          animationDuration: 1500
          animationRule: linear
          fontNumbersSize: 20
  - type: grid
    cards:
    - type: custom:mini-graph-card
      title: 24h Outside Temperature
      hours_to_show: 24
      line_width: 3
      points_per_hour: 2
      height: 120
      font_size: 150
      entities:
      - entity: sensor.hp2564ca_pro_v2_1_4_outdoor_temperature
        name: Temp
        color: '#ff5722'
      show:
        graph: line
        fill: fade
        icon: true
        legend: false
        extrema: true
        labels: false
    - type: glance
      title: Inside vs Outside
      show_icon: false
      columns: 4
      entities:
      - entity: sensor.hp2564ca_pro_v2_1_4_indoor_temperature
        name: In
      - entity: sensor.hp2564ca_pro_v2_1_4_outdoor_temperature
        name: Out
      - entity: sensor.hp2564ca_pro_v2_1_4_indoor_humidity
        name: In RH
      - entity: sensor.hp2564ca_pro_v2_1_4_humidity
        name: Out RH
      card_mod:
        style:
          .entity$: ".name {\n  font-size: 15px !important;\n  color: var(--secondary-text-color) !important;\n}\ndiv:not(.name) {\n  font-size: 22px !important;\n  font-weight: 700 !important;\n  line-height: 1.25 !important;\n  white-space: nowrap !important;\n\
            }\n"
          .: "ha-card {\n  --ha-card-header-font-size: 24px;\n}\n"
  - type: grid
    column_span: 1
    card_mod:
      style: ".grid.grid-container {\n  gap: 4px !important;\n}\n"
    cards:
    - type: gauge
      entity: sensor.live_lightning_distance
      name: ⚡ Storm Distance
      min: 0
      max: 40
      needle: true
      segments:
      - from: 0
        color: '#f44336'
      - from: 10
        color: '#ff9800'
      - from: 25
        color: '#ffeb3b'
    - type: custom:mini-graph-card
      title: Lightning Strike Activity (24h)
      entities:
      - entity: sensor.lightning_strikes_per_hour
        name: Strikes / hour
        color: '#ffeb3b'
      hours_to_show: 24
      height: 70
      font_size: 140
      aggregate_func: max
      group_by: hour
      lower_bound: 0
      upper_bound: ~10
      show:
        graph: bar
        fill: false
        icon: true
        legend: false
        extrema: false
        labels: false
    - type: markdown
      content: '{% set s = states(''sensor.hp2564ca_pro_v2_1_4_last_lightning_strike'') %} ⏱️ **Last strike:** {% if s not in [''unknown'', ''unavailable'', ''None''] %} {{ relative_time(as_datetime(s)) }} ago {% else %} none recorded {% endif %}'
      card_mod:
        style: "ha-card {\n  font-size: 20px !important;\n  /* Default card padding (~16px top/bottom) is excessive for\n     one short line - this card was the biggest contributor to\n     the dead space in this column. */\n  padding-top: 6px !important;\n\
          \  padding-bottom: 6px !important;\n  margin-bottom: 0 !important;\n}\nha-markdown {\n  margin: 0 !important;\n}\n"
  - type: grid
    cards:
    - type: iframe
      url: /local/bom-radar.html?v=2
      grid_options:
        rows: 6
    - type: markdown
      content: '{% set peak_raw = states(''sensor.rain_next_hour_peak'') %}

        {% set have = peak_raw not in [''unknown'',''unavailable'',''none'',''''] %}

        {% set onset_raw = states(''sensor.rain_onset_minutes'') %}

        {% set coming = onset_raw not in [''unknown'',''unavailable'',''none'',''''] %}

        {% set m = onset_raw | int(-1) %}

        {% set peak = peak_raw | float(0) %}

        {% set chance = states(''sensor.rain_next_hour_chance'') | float(0) %}

        {% set band = ''Heavy'' if peak >= 7.5 else (''Moderate'' if peak >= 2.5 else ''Light'') %}

        {% if not have %}

        {% set head = ''NO DATA'' %}

        {% set detail = ''Rain forecast unavailable'' %}

        {% elif not coming %}

        {% set head = ''DRY'' %}

        {% set detail = (''Nothing in the next hour'' if chance < 10 else (chance | round(0) | int) ~ ''% chance, nothing significant'') %}

        {% elif m <= 0 %}

        {% set head = ''RAINING NOW'' %}

        {% set detail = band ~ '', up to '' ~ peak ~ '' mm/h'' %}

        {% else %}

        {% set head = ''RAIN IN '' ~ m ~ '' MIN'' %}

        {% set detail = band ~ '' - '' ~ (chance | round(0) | int) ~ ''% chance'' ~ ('' (uncertain)'' if chance < 50 else '''') %}

        {% endif %}

        # {{ head }}

        {{ detail }}'
      card_mod:
        style: "{% set peak_raw = states('sensor.rain_next_hour_peak') %} {% set have = peak_raw not in ['unknown','unavailable','none',''] %} {% set coming = states('sensor.rain_onset_minutes') not in ['unknown','unavailable','none',''] %} {% if not have\
          \ %}\n  {% set bg = '#616161' %}\n  {% set fg = '#ffffff' %}\n{% elif coming %}\n  {% set bg = '#1565c0' %}\n  {% set fg = '#ffffff' %}\n{% else %}\n  {% set bg = 'var(--ha-card-background, var(--card-background-color))' %}\n  {% set fg = 'var(--primary-text-color)'\
          \ %}\n{% endif %} ha-card {\n  background: {{ bg }} !important;\n  border: none !important;\n  text-align: center !important;\n  color: {{ fg }} !important;\n  height: 100% !important;\n  box-sizing: border-box !important;\n  display: flex !important;\n\
          \  flex-direction: column !important;\n  justify-content: center !important;\n  align-items: center !important;\n} ha-card h1 {\n  /* 26px, not 32: \"RAIN IN 12 MIN\" is longer than any traffic\n     light headline and wraps at 32px in this 362px\
          \ column. */\n  font-size: 26px !important;\n  font-weight: 800 !important;\n  line-height: 1.15 !important;\n  margin: 2px 0 6px 0 !important;\n  border-bottom: none !important;\n  color: {{ fg }} !important;\n} ha-card p {\n  font-size: 15px\
          \ !important;\n  line-height: 1.3 !important;\n  margin: 0 !important;\n  color: {{ fg }} !important;\n}"
      grid_options:
        rows: 3
  - type: grid
    cards:
    - type: custom:apexcharts-card
      header:
        show: true
        title: Rain Timeline & Total Accumulation
      graph_span: 24h
      span:
        start: day
      now:
        show: true
        label: Now
      apex_config:
        chart:
          height: 260
        stroke:
          curve: smooth
      yaxis:
      - id: rain
        min: 0
        decimals: 1
        apex_config:
          title:
            text: mm
      series:
      - entity: sensor.hp2564ca_pro_v2_1_4_rain_rate_piezo
        name: Rain Intensity
        type: column
        color: '#1e88e5'
        opacity: 0.6
        stroke_width: 0
        group_by:
          func: max
          duration: 5min
      - entity: sensor.hp2564ca_pro_v2_1_4_daily_rain_piezo
        name: Day Total Accumulated
        type: line
        stroke_width: 3
        color: '#ff9800'
        curve: stepline
    - type: markdown
      title: Wind
      content: "{% set deg = states('sensor.hp2564ca_pro_v2_1_4_wind_direction_10m_avg') | float(-1) %}\n{% set dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE',\n               'S','SSW','SW','WSW','W','WNW','NW','NNW'] %}\n{% set compass = dirs[(((deg\
        \ / 22.5) + 0.5) | int) % 16] if deg >= 0 else '--' %}\n| Speed | From | Max Today |\n|:-:|:-:|:-:|\n| {{ states('sensor.hp2564ca_pro_v2_1_4_wind_speed') | float(0) | round(1) }} kn | {{ compass }} | {{ states('sensor.hp2564ca_pro_v2_1_4_max_daily_gust')\
        \ | float(0) | round(1) }} kn |"
      card_mod:
        style:
          ha-markdown$: "table {\n  width: 100% !important;\n  border-collapse: collapse !important;\n  margin: 0 !important;\n}\nth, td {\n  width: 33.33% !important;\n  text-align: center !important;\n  border: none !important;\n}\nth {\n  font-size:\
            \ 15px !important;\n  font-weight: 400 !important;\n  color: var(--secondary-text-color) !important;\n  padding: 0 0 2px 0 !important;\n}\ntd {\n  font-size: 28px !important;\n  font-weight: 700 !important;\n  padding: 0 !important;\n  white-space:\
            \ nowrap !important;\n}\n"
          .: "ha-card {\n  --ha-card-header-font-size: 24px;\n  padding-top: 6px !important;\n  padding-bottom: 6px !important;\n  margin-bottom: 0 !important;\n}\n"
  - type: grid
    cards:
    - type: glance
      title: Right Now
      show_name: true
      show_state: true
      show_icon: false
      columns: 3
      entities:
      - entity: sensor.hp2564ca_pro_v2_1_4_feels_like_temperature
        name: Feels Like
      - entity: sensor.hp2564ca_pro_v2_1_4_outdoor_temperature
        name: Actual
      - entity: sensor.hp2564ca_pro_v2_1_4_humidity
        name: Humidity
      - entity: sensor.hp2564ca_pro_v2_1_4_wind_gust
        name: Gust
      - entity: binary_sensor.hp2564ca_pro_v2_1_4_rain_state_piezo
        name: Raining?
      - entity: sensor.hp2564ca_pro_v2_1_4_rain_rate_piezo
        name: Rain Rate
      card_mod:
        style:
          .entity$: ".name {\n  font-size: 16px !important;\n  color: var(--secondary-text-color) !important;\n}\ndiv:not(.name) {\n  /* 34px truncated (\"19.3...\") in a 3-col ~120px cell.\n     26px fits \"19.3 °C\" / \"0.0 mm/h\" without ellipsis. */\n\
            \  font-size: 26px !important;\n  font-weight: 700 !important;\n  line-height: 1.25 !important;\n  white-space: nowrap !important;\n}\n"
          .entity:last-child$: "div:not(.name) {\n  font-size: 21px !important;\n}\n"
          .: "ha-card {\n  --ha-card-header-font-size: 26px;\n}\n"
  - type: grid
    cards:
    - type: markdown
      title: Sun & Moon
      content: "{% set rise = states('sensor.sun_next_rising') %}\n{% set set_ = states('sensor.sun_next_setting') %}\n{% set p = states('sensor.moon_phase') %}\n{% set em = {\n     'new_moon': '\U0001F311',\n     'waxing_crescent': '\U0001F318',\n   \
        \  'first_quarter': '\U0001F317',\n     'waxing_gibbous': '\U0001F316',\n     'full_moon': '\U0001F315',\n     'waning_gibbous': '\U0001F314',\n     'last_quarter': '\U0001F313',\n     'waning_crescent': '\U0001F312' } %}\n# ↑ {{ as_timestamp(rise)\
        \ | timestamp_custom('%H:%M') }}   ↓ {{ as_timestamp(set_) | timestamp_custom('%H:%M') }}\n## {{ em.get(p, '\U0001F319') }}\n{{ p | replace('_', ' ') | title }}"
      card_mod:
        style:
          ha-markdown$: "h1 {\n  /* sunrise / sunset times */\n  font-size: 30px !important;\n  font-weight: 700 !important;\n  line-height: 1.2 !important;\n  margin: 0 0 2px 0 !important;\n  border-bottom: none !important;\n  text-align: center !important;\n\
            }\nh2 {\n  /* The moon glyph, alone on its line so it can be sized\n     independently. 80px (was 100px): at 100px with\n     line-height 1.0 the emoji's ascender overflowed its line\n     box upward and collided with the sunset arrow in the\
            \ h1\n     above. Slightly looser line-height + a top margin keep it\n     clear. */\n  font-size: 80px !important;\n  line-height: 1.15 !important;\n  margin: 6px 0 0 0 !important;\n  border-bottom: none !important;\n  font-weight: 400 !important;\n\
            \  text-align: center !important;\n}\np {\n  /* phase name */\n  font-size: 20px !important;\n  font-weight: 600 !important;\n  margin: 2px 0 0 0 !important;\n  text-align: center !important;\n}\n"
          .: "ha-card {\n  text-align: center !important;\n  --ha-card-header-font-size: 22px;\n}\n"
  - type: grid
    cards:
    - type: glance
      title: Rainfall Totals
      show_icon: false
      columns: 4
      entities:
      - entity: sensor.hp2564ca_pro_v2_1_4_24h_rain_piezo
        name: 24 h
      - entity: sensor.hp2564ca_pro_v2_1_4_weekly_rain_piezo
        name: Week
      - entity: sensor.hp2564ca_pro_v2_1_4_monthly_rain_piezo
        name: Month
      - entity: sensor.hp2564ca_pro_v2_1_4_yearly_rain_piezo
        name: Year
      card_mod:
        style:
          .entity$: ".name {\n  font-size: 15px !important;\n  color: var(--secondary-text-color) !important;\n}\ndiv:not(.name) {\n  font-size: 19px !important;\n  font-weight: 700 !important;\n  line-height: 1.25 !important;\n  white-space: nowrap !important;\n\
            }\n"
          .: "ha-card {\n  --ha-card-header-font-size: 24px;\n}\n"
