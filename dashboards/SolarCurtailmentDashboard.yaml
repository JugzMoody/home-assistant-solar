title: Solar Curtailment
views:
  - title: Curtailment
    path: curtailment
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 3
    sections:
      # ============================================================
      # COLUMN 1 — status tiles + gauges
      # ============================================================
      - type: grid
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.grid_connection_status
                name: Grid Connection
                color: green
                # Resilient status (configuration.yaml): local grid_status when
                # available, else "Active" while cloud grid telemetry is flowing.
                # Text: "Active" (on-grid), "Off-Grid" (islanded), or "Unknown".
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(76,175,80,0.10)' if is_state(config.entity, 'Active') else 'rgba(244,67,54,0.30)' }};
                    }
              - type: tile
                entity: input_boolean.manual_full_curtail
                name: Manual Full Curtail
                color: red
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(244,67,54,0.28)' if is_state(config.entity, 'on') else 'rgba(76,175,80,0.10)' }};
                    }
              - type: tile
                entity: binary_sensor.fronius_curtailment_active
                name: Fronius Curtailed
                color: red
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(244,67,54,0.28)' if is_state(config.entity, 'on') else 'rgba(76,175,80,0.10)' }};
                    }
              - type: tile
                entity: binary_sensor.sungrow_curtailment_active
                name: Sungrow Curtailed
                color: red
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(244,67,54,0.28)' if is_state(config.entity, 'on') else 'rgba(76,175,80,0.10)' }};
                    }
              - type: tile
                entity: sensor.power_sync_solar_curtailment
                name: PowerSync DC Curtailment
                color: amber
                # State is text: "Active" (curtailment should be on) or "Normal".
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(255,193,7,0.25)' if is_state(config.entity, 'Active') else 'rgba(76,175,80,0.10)' }};
                    }
              - type: tile
                entity: binary_sensor.export_price_negative
                name: Export Negative
                color: red
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(244,67,54,0.28)' if is_state(config.entity, 'on') else 'rgba(76,175,80,0.10)' }};
                    }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.fronius_power_limit
                name: Fronius Limit
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 1
                  green: 100
              - type: gauge
                entity: sensor.sungrow_power_limit
                name: Sungrow Limit
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 1
                  green: 100
              - type: gauge
                entity: sensor.fronius_output_percent
                name: Fronius Output
                min: 0
                max: 100
                needle: true
              - type: gauge
                entity: sensor.sungrow_output_percent
                name: Sungrow Output
                min: 0
                max: 100
                needle: true
          # Actual instantaneous output (W), large + centered, under the dials.
          - type: grid
            columns: 2
            square: false
            cards:
              # Centering needs the card-mod HACS plugin (HA strips inline
              # styles from markdown). Markdown '#' gives the large text; the
              # card_mod CSS centers it (and is ignored harmlessly if card-mod
              # isn't installed — text just stays left-aligned).
              - type: markdown
                content: |
                  Fronius Output

                  # {{ states('sensor.fronius_live_ac_power') }} W
                card_mod:
                  style: |
                    ha-card {
                      text-align: center;
                    }
              - type: markdown
                content: |
                  Sungrow Output

                  # {{ states('sensor.sungrow_live_power_output') }} W
                card_mod:
                  style: |
                    ha-card {
                      text-align: center;
                    }
      # ============================================================
      # COLUMN 2 — State Timeline
      # ============================================================
      - type: grid
        cards:
          - type: history-graph
            title: State Timeline (24h)
            hours_to_show: 24
            entities:
              - entity: input_boolean.manual_full_curtail
              - entity: binary_sensor.fronius_curtailment_active
              - entity: binary_sensor.sungrow_curtailment_active
              - entity: sensor.power_sync_battery_level
                name: Battery SOC (%)
              - entity: sensor.export_price_cents
                name: Export Price (c/kWh)
      # ============================================================
      # COLUMN 3 — everything else
      # ============================================================
      - type: grid
        cards:
          - type: entities
            title: Curtailment & Live Values
            state_color: true
            entities:
              # Freshness: the clock should match wall time (view is live), and
              # the Fronius power 'last updated' should read a few seconds ago
              # (Modbus data is actually flowing, not stale).
              - entity: sensor.date_time
                name: Clock (should match now)
              - entity: sensor.fronius_live_ac_power
                name: Fronius data updated
                secondary_info: last-updated
              - type: divider
              - entity: input_number.solar_curtail_limit
                name: Commanded Limit
              - entity: input_number.solar_curtail_target_kw
                name: Grid Target (− = allow export)
              - type: divider
              - entity: sensor.power_sync_current_export_price
                name: Export Price ($/kWh)
              - entity: sensor.power_sync_grid_power
                name: Grid Power (− = exporting)
              - entity: sensor.grid_power_smoothed
                name: Grid Power (smoothed — loop input)
              - entity: sensor.power_sync_battery_level
                name: Battery SOC
          # Auto-Apply "floating floor": the optimizer reserve actually being
          # enforced right now vs what the forecast bridge wants, pulled from
          # the reserve_recommendation attribute on optimization_status. The
          # value is a nested dict key, so an entities row can't show it
          # directly - a small markdown card renders it. Watch 'Applied' climb
          # above the configured minimum during the 4-9pm window when
          # Auto-Apply is on.
          - type: markdown
            content: |-
              {% set rr = state_attr('sensor.power_sync_optimization_status', 'reserve_recommendation') %}
              {% set opt_status = states('sensor.power_sync_optimization_status') %}
              ### Optimizer reserve (floating floor)
              {% if rr is none %}
              Attribute unavailable (sensor not reporting).
              {% elif rr.get('applied_optimizer_reserve_percent') is not none %}
              **Applied (enforced now): {{ rr.get('applied_optimizer_reserve_percent') }}%**  &nbsp; • &nbsp; Suggested: {{ rr.get('suggested_optimizer_reserve_percent', '?') }}%

              Configured min: {{ rr.get('configured_optimizer_reserve_percent', '?') }}% &nbsp; • &nbsp; Hardware: {{ rr.get('hardware_reserve_percent', '?') }}% &nbsp; • &nbsp; Raising above min? **{{ 'YES' if rr.get('needs_optimizer_reserve_raise') else 'no' }}**
              {% set pu = rr.get('protects_until') %}
              {% if pu %}

              Protects until **{{ as_timestamp(pu) | timestamp_custom('%a %H:%M') }}** ({{ rr.get('next_charge_reason','?') }})
              {% endif %}
              {% if rr.get('note') %}

              _{{ rr.get('note') }}_
              {% endif %}
              {% else %}
              No active recommendation right now (optimizer **{{ opt_status }}**, no export window to bridge from). The floating floor only computes when an export window has evening load ahead of it — expect values to appear during tomorrow's afternoon window.
              {% endif %}
          - type: entities
            title: Powerwall Health (local TEDAPI)
            state_color: true
            entities:
              - entity: binary_sensor.powerwall_fault_present
                name: Fault Present (severity-tagged)
              - entity: sensor.powerwall_actionable_alerts
                name: Actionable Alerts
              - entity: sensor.power_sync_pw_active_alerts
                name: All Gateway Alerts (mostly info)
              # Optional — confirm this entity_id in Developer Tools → States:
              - entity: binary_sensor.power_sync_powerwall_local_paired
                name: Local Control Paired
