
# Loads default set of integrations. Do not remove.
default_config:

# Recorder retention. PowerSync's load forecaster uses a rolling 30-day
# lookback, so keep at least ~30 days of raw history for full-resolution
# pattern matching. (Long-term hourly statistics are kept indefinitely
# regardless of this setting.) Larger values grow the database.
recorder:
  purge_keep_days: 35

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ==========================================
# LOCAL INVERTER NETWORK CONNECTIONS (MODBUS)
# ==========================================
modbus:
  - name: fronius_inverter
    type: tcp
    host: 192.168.0.41
    port: 502
    sensors:
      # SunSpec W uses a DYNAMIC scale factor (W_SF at 40084) that the Fronius
      # changes with power range (-2 at low output, -1 mid, 0 high) to keep the
      # 16-bit mantissa in range. A fixed scale is only correct in one band, so
      # read the raw mantissa + W_SF and combine them in a template sensor
      # (sensor.fronius_live_ac_power) below.
      - name: "Fronius AC Power Raw"
        slave: 1
        address: 40083          # SunSpec W mantissa (int16, unscaled)
        data_type: int16
        scan_interval: 10
      - name: "Fronius W Scale Factor"
        slave: 1
        address: 40084          # W_SF exponent: real W = raw * 10^W_SF
        data_type: int16
        scan_interval: 10
      # WMaxLim_Ena readback (Model 123 @ id_reg 40227, confirmed by direct SunSpec scan)
      - name: "Fronius Curtailment Enabled"
        slave: 1
        address: 40236          # WMaxLim_Ena: 1 = limit active, 0 = inactive
        data_type: uint16
        scan_interval: 5
      # WMaxLimPct readback (scale factor -2, so 10000 = 100.00%)
      - name: "Fronius WMaxLimPct Readback"
        slave: 1
        address: 40232          # WMaxLimPct
        data_type: uint16
        scan_interval: 5
      - name: "Fronius Grid Frequency"
        slave: 1
        address: 40085          # SunSpec Hz (Hz_SF = -2 -> scale 0.01); reads 0 at night
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: "Hz"
        scan_interval: 10
      - name: "Fronius Grid Voltage"
        slave: 1
        address: 40079          # SunSpec PhVphA; V_SF at 40082 = -2 -> scale 0.01
        data_type: uint16       # voltage range is narrow, so V_SF stays -2 (no dynamic-SF issue like W)
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        scan_interval: 10
      - name: "Fronius Lifetime Energy"
        slave: 1
        address: 40093          # SunSpec WH (acc32, big-endian); WH_SF at 40095 = 0 (Wh)
        data_type: uint32
        scale: 0.001            # Wh -> kWh
        precision: 1
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        scan_interval: 30
      - name: "Fronius Operating State Code"
        slave: 1
        address: 40107          # SunSpec St (operating state): 4=MPPT, 5=Throttled, 7=Fault
        data_type: uint16
        scan_interval: 10
      # --- Per-string DC (SunSpec "Multiple MPPT" model 160 @ 40253) ---
      # Verified by live SunSpec scan: N=2 modules, block length 20, data base
      # 40255. This Primo has 2 MPPT inputs. String 1 was live (271V/2975W),
      # String 2 read 0V/0W — watch whether String 2 is a dead/unused input.
      # SFs (model 160 header): DCV_SF = -2 (stable), DCW_SF = -1 (may be
      # dynamic like the AC W_SF, so DC power is templated from raw + SF below).
      - name: "Fronius String 1 DC Voltage"
        slave: 1
        address: 40273          # module 1 DCV (SF -2 -> scale 0.01)
        data_type: uint16
        nan_value: 65535        # 0xFFFF = SunSpec "not implemented" (dusk dropout) -> unavailable
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        scan_interval: 30
      - name: "Fronius String 2 DC Voltage"
        slave: 1
        address: 40293          # module 2 DCV (block 2 = block 1 + 20 regs)
        data_type: uint16
        nan_value: 65535        # 0xFFFF = SunSpec "not implemented" (dusk dropout) -> unavailable
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        scan_interval: 30
      # DC current per string (SF -2 -> scale 0.01, STATIC — unlike DCW_SF).
      # We compute DC power as V x A in the template below, which avoids the
      # dynamic DCW_SF entirely (that SF shifts between -1 and -2 by power band,
      # and reading it a scan apart from the raw mantissa produced 10x spikes).
      - name: "Fronius String 1 DC Current"
        slave: 1
        address: 40272          # module 1 DCA
        data_type: uint16
        nan_value: 65535        # 0xFFFF = SunSpec "not implemented" (dusk dropout) -> unavailable
        scale: 0.01
        precision: 2
        unit_of_measurement: "A"
        scan_interval: 30
      - name: "Fronius String 2 DC Current"
        slave: 1
        address: 40292          # module 2 DCA
        data_type: uint16
        nan_value: 65535        # 0xFFFF = SunSpec "not implemented" (dusk dropout) -> unavailable
        scale: 0.01
        precision: 2
        unit_of_measurement: "A"
        scan_interval: 30
      # --- Fault event flags (SunSpec model 101 Evt1 @ 40109, uint32) ---
      # Reads 0 in normal/phantom-throttle states; non-zero = a real protective
      # condition (OVER_TEMP, AC_OVER_VOLT, DC_OVER_VOLT, etc.). Temperature
      # itself is NOT exposed by this inverter (models 103 and 160 both report
      # "not implemented"), so this flag is the only genuine fault signal.
      - name: "Fronius Event Flags"
        slave: 1
        address: 40109
        data_type: uint32
        scan_interval: 30

  - name: sungrow_inverter
    type: tcp
    host: 192.168.0.42
    port: 502
    sensors:
      - name: "Sungrow Live Power Output"
        slave: 1
        address: 5016
        input_type: input
        data_type: int32
        swap: word              # Sungrow is little-endian word order (low word first)
        precision: 0
        unit_of_measurement: "W"
        scan_interval: 10
      # Power Limitation readbacks (SG string map, confirmed by live scan; wire addr = doc - 1)
      - name: "Sungrow Power Limit Switch"
        slave: 1
        address: 5006           # doc reg 5007: 170 (0xAA) = enabled, 85 (0x55) = disabled
        input_type: holding
        data_type: uint16
        scan_interval: 5
      - name: "Sungrow Power Limit Ratio"
        slave: 1
        address: 5007           # doc reg 5008: 0-1000 = 0.0-100.0% (0 = full curtailment)
        input_type: holding
        data_type: uint16
        scan_interval: 5
      - name: "Sungrow Grid Frequency"
        slave: 1
        address: 5035           # grid frequency (input reg), scale 0.1; reads 0 at night
        input_type: input
        data_type: uint16
        scale: 0.1
        precision: 2
        unit_of_measurement: "Hz"
        scan_interval: 10
      - name: "Sungrow Operating State Code"
        slave: 1
        address: 5037           # running state (input reg); SG5.0RS running = 0x8200 (33280)
        input_type: input
        data_type: uint16
        scan_interval: 10
      # Native energy yields (SG string map; wire addr = doc - 1). Confirmed by
      # live scan while HA stopped, cross-checked against nominal power (5000 =
      # 5.0 kW) and grid freq (5035 = 50.0 Hz). These match the LCD and reset
      # themselves at midnight — no Riemann integration needed.
      - name: "Sungrow Daily Energy"
        slave: 1
        address: 5002           # doc reg 5003 "Daily power yields", uint16, 0.1 kWh
        input_type: input
        data_type: uint16
        scale: 0.1
        precision: 1
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        scan_interval: 60
      - name: "Sungrow Lifetime Energy"
        slave: 1
        address: 5003           # doc reg 5004 "Total power yields", uint32 (word-swap), 1 kWh
        input_type: input
        data_type: uint32
        swap: word
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        scan_interval: 60


# ==========================================
# UNIFIED POWERSYNC MASTER CURTAILMENT CONTROL
# ==========================================
template:
  # ------------------------------------------------------------------
  # Friendly on/off indicators derived from the raw Modbus readbacks.
  # (Modbus registers report numbers like 170/85 or 0/1 - these expose
  #  clean binary_sensor on/off states for the dashboard.)
  # ------------------------------------------------------------------
  - binary_sensor:
      - name: "Sungrow Power Limit Enabled"
        unique_id: sungrow_power_limit_enabled
        # Register 5006: 170 (0xAA) = limiter armed, 85 (0x55) = disabled
        # No availability template: reads "off" (not armed) when the inverter
        # is asleep/unreachable instead of flapping to 'unavailable' (which
        # spammed the logbook every dusk/dawn).
        state: "{{ states('sensor.sungrow_power_limit_switch') | int(-1) == 170 }}"
        icon: "mdi:speedometer"

      - name: "Sungrow Curtailment Active"
        unique_id: sungrow_curtailment_active
        # Proportional-aware: ON whenever the ratio is below 100% (ratio < 1000),
        # not only at full 0% curtailment.
        # No availability template (see above) — defaults to "off" when asleep.
        state: "{{ states('sensor.sungrow_power_limit_ratio') | int(1000) < 1000 }}"
        icon: "mdi:solar-power-variant"

      - name: "Fronius Curtailment Active"
        unique_id: fronius_curtailment_active
        # Proportional-aware: ON only when the limiter is enabled (40236 == 1)
        # AND the limit is actually below 100% (WMaxLimPct < 10000). Armed-at-100%
        # no longer reads as "curtailed".
        # No availability template (see above) — defaults to "off" when asleep.
        state: >-
          {{ states('sensor.fronius_curtailment_enabled') | int(0) == 1
             and states('sensor.fronius_wmaxlimpct_readback') | int(10000) < 10000 }}
        icon: "mdi:solar-power-variant"

      - name: "Fronius Autonomous Throttle"
        unique_id: fronius_autonomous_throttle
        icon: "mdi:speedometer-slow"
        # ON when the inverter reports Throttled (St=5) while our limiter is
        # FULLY DISABLED (Ena == 0) — i.e. it's genuinely throttling on its own
        # (Volt-Watt / Freq-Watt / autonomous), losing real generation. The
        # Ena==0 guard is essential: the Fronius reports St=5 whenever the
        # limiter is armed (Ena=1) EVEN AT 100%, so keying off St alone gave a
        # false "autonomous throttle" whenever the limiter was left armed.
        state: >-
          {{ states('sensor.fronius_operating_state_code') | int(-1) == 5
             and states('sensor.fronius_curtailment_enabled') | int(0) == 0 }}

      - name: "Output Suppressed"
        unique_id: output_suppressed
        icon: "mdi:solar-power-variant-outline"
        # ON when site output is being held BELOW its potential — by our
        # proportional/manual curtailment OR autonomous inverter throttling.
        # While ON, actual < potential, so forecast-vs-actual is NOT a valid
        # measure of system health/age. Use it to exclude/flag those periods.
        state: >-
          {{ is_state('input_boolean.manual_full_curtail', 'on')
             or (states('input_number.solar_curtail_limit') | float(100) < 100)
             or is_state('binary_sensor.fronius_curtailment_active', 'on')
             or is_state('binary_sensor.sungrow_curtailment_active', 'on')
             or is_state('binary_sensor.fronius_autonomous_throttle', 'on') }}

      - name: "Export Price Negative"
        unique_id: export_price_negative
        icon: "mdi:cash-minus"
        # ON when export price < 0 — i.e. curtailment SHOULD be active (this is
        # exactly the condition the proportional loop engages on).
        state: "{{ states('sensor.power_sync_current_export_price') | float(0) < 0 }}"

      - name: "Fronius Fault"
        unique_id: fronius_fault
        device_class: problem
        icon: "mdi:alert"
        # ON when SunSpec Evt1 event flags (@40109) are non-zero — a genuine
        # protective condition (OVER_TEMP, AC/DC_OVER_VOLT, OVER_FREQ, etc.).
        # St=5 alone is NOT a fault (usually just the limiter armed), so this is
        # the real fault signal. Temperature is not exposed by this inverter.
        state: "{{ states('sensor.fronius_event_flags') | int(0) > 0 }}"

  # ------------------------------------------------------------------
  # Commanded power-limit as a friendly 0-100% (for gauge cards).
  # Fronius WMaxLimPct: 0-10000 (SF -2) -> divide by 100.
  # Sungrow ratio:      0-1000          -> divide by 10.
  # NOTE: these reflect the MODBUS-COMMANDED limit only. Frequency-shift
  #       curtailment does NOT change these - it drops live output + raises Hz.
  # ------------------------------------------------------------------
  - sensor:
      - name: "Fronius Power Limit %"
        unique_id: fronius_power_limit_pct
        unit_of_measurement: "%"
        state: "{{ (states('sensor.fronius_wmaxlimpct_readback') | int(0) / 100) | round(0) }}"
        availability: "{{ states('sensor.fronius_wmaxlimpct_readback') not in ['unknown', 'unavailable'] }}"

      - name: "Sungrow Power Limit %"
        unique_id: sungrow_power_limit_pct
        unit_of_measurement: "%"
        state: "{{ (states('sensor.sungrow_power_limit_ratio') | int(0) / 10) | round(0) }}"
        availability: "{{ states('sensor.sungrow_power_limit_ratio') not in ['unknown', 'unavailable'] }}"

      # Per-string DC power = DC voltage x DC current. Both have STATIC scale
      # factors (SF -2), so this is immune to the DCW_SF dynamic-scale spikes
      # (the old raw-mantissa x 10^DCW_SF approach produced ~10x glitches when
      # the mantissa and the separately-read, band-switching SF were a poll out
      # of step). V and A can be read a scan apart with no ill effect.
      - name: "Fronius String 1 DC Power"
        unique_id: fronius_string1_dc_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.fronius_string_1_dc_voltage') | float(0) %}
          {% set a = states('sensor.fronius_string_1_dc_current') | float(0) %}
          {{ (v * a) | round(0) }}
        availability: >-
          {{ states('sensor.fronius_string_1_dc_voltage') not in ['unknown', 'unavailable']
             and states('sensor.fronius_string_1_dc_current') not in ['unknown', 'unavailable'] }}
      - name: "Fronius String 2 DC Power"
        unique_id: fronius_string2_dc_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.fronius_string_2_dc_voltage') | float(0) %}
          {% set a = states('sensor.fronius_string_2_dc_current') | float(0) %}
          {{ (v * a) | round(0) }}
        availability: >-
          {{ states('sensor.fronius_string_2_dc_voltage') not in ['unknown', 'unavailable']
             and states('sensor.fronius_string_2_dc_current') not in ['unknown', 'unavailable'] }}

      # Combined DC input current across both MPPT channels. After the daisy-
      # chain fix (String 2 enabled) the total is what matters for spotting the
      # ~12 A-per-channel clip: each channel can now share the array current, so
      # the total should track true array output rather than pinning at one
      # channel's 11.5 A ceiling. Sums whichever channels are currently valid so
      # it stays available if one input reads unavailable at dusk.
      - name: "Fronius String Total DC Current"
        unique_id: fronius_string_total_dc_current
        unit_of_measurement: "A"
        device_class: current
        state: >-
          {% set a1 = states('sensor.fronius_string_1_dc_current') | float(0) %}
          {% set a2 = states('sensor.fronius_string_2_dc_current') | float(0) %}
          {{ (a1 + a2) | round(2) }}
        availability: >-
          {{ states('sensor.fronius_string_1_dc_current') not in ['unknown', 'unavailable']
             or states('sensor.fronius_string_2_dc_current') not in ['unknown', 'unavailable'] }}

  # ------------------------------------------------------------------
  # Decoded operating state (text) + output-vs-rated indicators.
  # Output % = live AC power / rated (5000 W each). NOTE: this reflects
  # ANY output reduction including frequency-shift curtailment - but also
  # drops on cloud cover, so it is a proxy, not a pure curtailment signal.
  # ------------------------------------------------------------------
  - sensor:
      - name: "Fronius Operating State"
        unique_id: fronius_operating_state
        icon: >-
          {% set c = states('sensor.fronius_operating_state_code') | int(-1) %}
          {{ 'mdi:speedometer-slow' if c == 5 else 'mdi:alert' if c == 7 else 'mdi:solar-power' }}
        state: >-
          {% set c = states('sensor.fronius_operating_state_code') | int(-1) %}
          {% set m = {1:'Off', 2:'Sleeping', 3:'Starting', 4:'MPPT (Producing)',
                      5:'Throttled', 6:'Shutting Down', 7:'Fault', 8:'Standby'} %}
          {{ m.get(c, 'Unknown (' ~ c ~ ')') }}
        availability: "{{ states('sensor.fronius_operating_state_code') not in ['unknown', 'unavailable'] }}"

      - name: "Sungrow Operating State"
        unique_id: sungrow_operating_state
        icon: "mdi:solar-power"
        state: >-
          {% set c = states('sensor.sungrow_operating_state_code') | int(-1) %}
          {% set m = {0:'Running', 2:'Running', 33280:'Running', 32768:'Stopped',
                      40960:'Standby', 5120:'Initial Standby', 4608:'Shutdown',
                      4864:'Fault', 5376:'Maintenance', 5632:'Starting'} %}
          {{ m.get(c, 'Code ' ~ c) }}
        availability: "{{ states('sensor.sungrow_operating_state_code') not in ['unknown', 'unavailable'] }}"

      - name: "Fronius Output Percent"
        unique_id: fronius_output_percent
        unit_of_measurement: "%"
        # Rated 5000 W (Primo 5). sensor.fronius_live_ac_power is now scaled to
        # real watts (W_SF -1 -> scale 0.1), confirmed by daytime register scan.
        state: >-
          {{ [ (states('sensor.fronius_live_ac_power') | float(0) / 5000 * 100) | round(0), 100 ] | min }}
        availability: "{{ states('sensor.fronius_live_ac_power') not in ['unknown', 'unavailable'] }}"

      - name: "Sungrow Output Percent"
        unique_id: sungrow_output_percent
        unit_of_measurement: "%"
        # Rated 5000 W (SG5.0RS). sensor.sungrow_live_power_output is W (scale 1).
        state: >-
          {{ [ (states('sensor.sungrow_live_power_output') | float(0) / 5000 * 100) | round(0), 100 ] | min }}
        availability: "{{ states('sensor.sungrow_live_power_output') not in ['unknown', 'unavailable'] }}"

  # ------------------------------------------------------------------
  # Optimizer plan status: "committed vs not". Flags when a plan contains
  # arbitrage actions but execution is still self-consumption (the symptom
  # of the mode-projection infeasibility). Reads PowerSync's optimizer
  # status + next-action sensors.
  # ------------------------------------------------------------------
  - sensor:
      - name: "Optimizer Plan Status"
        unique_id: optimizer_plan_status
        icon: >-
          {% set cur = states('sensor.power_sync_optimization_status') | lower %}
          {{ 'mdi:check-circle' if cur in ['charge', 'discharge', 'export'] else 'mdi:pause-circle-outline' }}
        state: >-
          {% set cur = states('sensor.power_sync_optimization_status') | lower %}
          {% set nxt = states('sensor.power_sync_optimization_next_action') | lower %}
          {% if cur in ['unknown', 'unavailable'] %}
            Unknown
          {% elif cur in ['charge', 'discharge', 'export'] %}
            Executing ({{ cur }})
          {% elif 'charge' in nxt or 'discharge' in nxt or 'export' in nxt %}
            Plan pending - not committed
          {% else %}
            Self-consumption only
          {% endif %}

  # ------------------------------------------------------------------
  # Powerwall gateway health (LOCAL TEDAPI only — not exposed via cloud).
  # PowerSync's "Powerwall Active Alerts" sensor lists ALL gateway alerts,
  # most of which are benign/informational (SystemConnectedToGrid,
  # FWUpdateSucceeded, GridCodesWrite, PodCommissionTime, etc.). Tesla only
  # attaches a `severity` to alerts that actually matter, so the real health
  # signal is the count of SEVERITY-TAGGED alerts — not the raw count.
  # (PowerSync's built-in critical-alert binary_sensor uses len(alerts)>0 and
  #  therefore false-alarms on the benign entries — these replace it.)
  # NOTE: confirm the source entity_id below in Developer Tools → States if
  #       these read 'unavailable' (HA may have named it slightly differently).
  # ------------------------------------------------------------------
  - sensor:
      - name: "Powerwall Actionable Alerts"
        unique_id: powerwall_actionable_alerts
        icon: mdi:alert-decagram
        state: >-
          {{ state_attr('sensor.power_sync_pw_active_alerts', 'severities')
             | default({}, true) | count }}
        availability: "{{ states('sensor.power_sync_pw_active_alerts') not in ['unknown', 'unavailable'] }}"

  - binary_sensor:
      - name: "Powerwall Fault Present"
        unique_id: powerwall_fault_present
        device_class: problem
        icon: mdi:battery-alert-variant
        # ON ("Problem") only when at least one severity-tagged alert exists.
        state: >-
          {{ (state_attr('sensor.power_sync_pw_active_alerts', 'severities')
              | default({}, true) | count) > 0 }}
        availability: "{{ states('sensor.power_sync_pw_active_alerts') not in ['unknown', 'unavailable'] }}"

  # ------------------------------------------------------------------
  # Export price in cents (c/kWh) for graphing alongside battery SOC (%).
  # $/kWh x 100 puts it on a similar magnitude to the 0-100 SOC scale so
  # both are visible on a single shared history-graph y-axis. Negative
  # values (pay-to-export) still render below zero — that's the crossover
  # with a full battery we want to see.
  # ------------------------------------------------------------------
  - sensor:
      - name: "Export Price Cents"
        unique_id: export_price_cents
        unit_of_measurement: "c/kWh"
        state: >-
          {{ ((states('sensor.power_sync_current_export_price') | float(0)) * 100) | round(1) }}
        availability: "{{ states('sensor.power_sync_current_export_price') not in ['unknown', 'unavailable'] }}"

  # ------------------------------------------------------------------
  # Combined instantaneous solar power (Fronius + Sungrow), in watts.
  # Used for a single "actual" line on the Solcast forecast-vs-actual
  # chart. Defaults each source to 0 when asleep/unreachable so the sum
  # stays available (no flapping).
  # ------------------------------------------------------------------
  - sensor:
      - name: "Total Solar Power"
        unique_id: total_solar_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {{ (states('sensor.fronius_live_ac_power') | float(0))
             + (states('sensor.sungrow_live_power_output') | float(0)) }}

  # ------------------------------------------------------------------
  # Solar tracking vs Solcast forecast.
  #   expected-so-far = forecast_today (total kWh) - remaining_today (kWh)
  #   actual-so-far   = sensor.solar_generated_today (daily utility_meter,
  #                     defined below, integrating Total Solar Power)
  #   tracking %      = (actual - expected) / expected * 100
  #                     +ve = ahead of forecast, -ve = behind.
  # Guarded so early morning (tiny expected) doesn't blow up the ratio.
  # ------------------------------------------------------------------
  - sensor:
      - name: "Solar Expected So Far"
        unique_id: solar_expected_so_far
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {% set total = states('sensor.solcast_pv_forecast_forecast_today') | float(0) %}
          {% set remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) %}
          {{ [total - remaining, 0] | max | round(2) }}

      - name: "Solar Tracking vs Forecast"
        unique_id: solar_tracking_vs_forecast
        unit_of_measurement: "%"
        # actual = PowerSync's Daily Solar Energy (Powerwall site metering,
        # pv_today_kwh) — authoritative and dropout-free. Confirm the exact
        # entity_id in Developer Tools if this reads 0.
        icon: >-
          {% set total = states('sensor.solcast_pv_forecast_forecast_today') | float(0) %}
          {% set remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) %}
          {% set expected = total - remaining %}
          {% set actual = states('sensor.power_sync_daily_solar_energy') | float(0) %}
          {% if expected < 0.2 %} mdi:progress-clock
          {% elif actual >= expected %} mdi:trending-up
          {% else %} mdi:trending-down {% endif %}
        state: >-
          {% set total = states('sensor.solcast_pv_forecast_forecast_today') | float(0) %}
          {% set remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) %}
          {% set expected = total - remaining %}
          {% set actual = states('sensor.power_sync_daily_solar_energy') | float(0) %}
          {% if expected >= 0.2 %}
            {{ ((actual - expected) / expected * 100) | round(0) }}
          {% else %}
            0
          {% endif %}

  # ------------------------------------------------------------------
  # Fronius live AC power with DYNAMIC SunSpec scale factor applied.
  # real W = raw mantissa (40083) x 10^W_SF (40084). Keeps this entity_id
  # (sensor.fronius_live_ac_power) so all downstream refs (total_solar_power,
  # output percent, dashboards) keep working — now correct across all ranges.
  # ------------------------------------------------------------------
  - sensor:
      - name: "Fronius Live AC Power"
        unique_id: fronius_live_ac_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set raw = states('sensor.fronius_ac_power_raw') %}
          {% set sf = states('sensor.fronius_w_scale_factor') %}
          {% if raw in ['unknown', 'unavailable'] or sf in ['unknown', 'unavailable'] %}
            {{ None }}
          {% else %}
            {% set p = raw | float(0) * (10 ** (sf | int(0))) %}
            {# W_SF is DYNAMIC and read as a separate register from the mantissa,
               so a poll-timing mismatch yields ~10x spikes (e.g. 31,930 W). AC
               can never exceed the DC input, so bound it by the (clean, V x A)
               String 1 DC power; if DC isn't ready, fall back to the ~5 kW
               inverter ceiling. On a spike, hold the last good value. #}
            {% set dc = states('sensor.fronius_string_1_dc_power') | float(-1) %}
            {% set cap = (dc * 1.05) if dc >= 200 else 5100 %}
            {% if p <= cap %}{{ p | round(0) }}
            {% else %}{{ states('sensor.fronius_live_ac_power') | float(0) }}{% endif %}
          {% endif %}
        availability: >-
          {{ states('sensor.fronius_ac_power_raw') not in ['unknown', 'unavailable']
             and states('sensor.fronius_w_scale_factor') not in ['unknown', 'unavailable'] }}

  # ------------------------------------------------------------------
  # FRONIUS "TODAY" via day-start baseline (no native daily register exists).
  # IMPORTANT: the Fronius Modbus is DEAD overnight — the connection times out
  # while the inverter sleeps, so the lifetime counter is UNAVAILABLE at
  # midnight. A 00:00 snapshot therefore failed and left the baseline stale,
  # making 'today' accumulate over multiple days. Instead we snapshot the
  # baseline at MORNING WAKE: the FIRST valid lifetime reading of a new day.
  # The counter doesn't change overnight, so that first morning value equals
  # the day's true starting point. today = lifetime_now - baseline.
  # ------------------------------------------------------------------
  - trigger:
      - platform: state
        entity_id: sensor.fronius_lifetime_energy
        not_to:
          - unavailable
          - unknown
    sensor:
      - name: "Fronius Lifetime At Midnight"
        unique_id: fronius_lifetime_at_midnight
        device_class: energy
        unit_of_measurement: "kWh"
        # Snapshot only ONCE per day (first valid reading). 'snap_date' guards
        # against re-snapshotting on every subsequent lifetime tick that day.
        state: >-
          {% set v = states('sensor.fronius_lifetime_energy') | float(-1) %}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set snapped = this.attributes.get('snap_date', '') %}
          {% if v > 0 and snapped != today %}{{ v | round(1) }}
          {% elif this.state not in ['unknown', 'unavailable'] %}{{ this.state }}
          {% else %}{{ v | round(1) }}{% endif %}
        attributes:
          snap_date: >-
            {% set v = states('sensor.fronius_lifetime_energy') | float(-1) %}
            {% set today = now().strftime('%Y-%m-%d') %}
            {% set snapped = this.attributes.get('snap_date', '') %}
            {% if v > 0 and snapped != today %}{{ today }}{% else %}{{ snapped }}{% endif %}
  - sensor:
      - name: "Fronius Energy Today"
        unique_id: fronius_energy_today
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        state: >-
          {% set now_v = states('sensor.fronius_lifetime_energy') | float(0) %}
          {% set base = states('sensor.fronius_lifetime_at_midnight') | float(0) %}
          {{ [now_v - base, 0] | max | round(2) }}
        availability: >-
          {{ states('sensor.fronius_lifetime_energy') not in ['unknown', 'unavailable']
             and states('sensor.fronius_lifetime_at_midnight') not in ['unknown', 'unavailable']
             and (states('sensor.fronius_lifetime_energy') | float(-1)) >= (states('sensor.fronius_lifetime_at_midnight') | float(0)) }}

  # ------------------------------------------------------------------
  # DAILY PER-ARRAY TRACKING — Solcast per-site daily forecast vs actual.
  #   delta % = (actual - forecast) / forecast x 100  (0 = matched, -ve = under)
  # EAST is captured at DUSK — the moment the Fronius lifetime sensor goes
  # UNAVAILABLE as the inverter sleeps. The Fronius has NO data overnight, so a
  # 23:58 snapshot read 0 (=> a bogus -100%). At the dusk transition
  # trigger.from_state holds the FINAL valid lifetime, so
  # (last_lifetime - day_start_baseline) = the completed day's East energy.
  # ALWAYS check 'curtailed_today': if true the delta is NOT a health signal.
  # ------------------------------------------------------------------
  - trigger:
      - platform: state
        entity_id: sensor.fronius_lifetime_energy
        to:
          - unavailable
          - unknown
    sensor:
      - name: "Fronius Daily Tracking (East)"
        unique_id: fronius_daily_tracking_east
        unit_of_measurement: "%"
        state: >-
          {% set last = trigger.from_state.state | float(-1) %}
          {% set base = states('sensor.fronius_lifetime_at_midnight') | float(-1) %}
          {% set fc = states('sensor.solar_wall_solcast_pv_forecast_home_east') | float(0) %}
          {% if last >= 0 and base >= 0 and last >= base and fc >= 0.5 %}
            {{ (((last - base) - fc) / fc * 100) | round(0) }}
          {% else %}{{ this.state }}{% endif %}
        attributes:
          forecast_kwh: "{{ states('sensor.solar_wall_solcast_pv_forecast_home_east') | float(0) | round(2) }}"
          actual_kwh: >-
            {% set last = trigger.from_state.state | float(-1) %}
            {% set base = states('sensor.fronius_lifetime_at_midnight') | float(0) %}
            {{ (last - base) | round(2) if (last >= base) else this.attributes.get('actual_kwh', 0) }}
          curtailed_today: "{{ (states('sensor.output_suppressed_today') | float(0)) > 0.1 }}"
  # WEST uses the Sungrow NATIVE daily register, which stays readable overnight
  # (the Sungrow holds its value while idle), so a 23:58 snapshot works fine.
  - trigger:
      - platform: time
        at: "23:58:00"
    sensor:
      - name: "Sungrow Daily Tracking (West)"
        unique_id: sungrow_daily_tracking_west
        unit_of_measurement: "%"
        state: >-
          {% set fc = states('sensor.solar_wall_solcast_pv_forecast_home_west') | float(0) %}
          {% set act = states('sensor.sungrow_daily_energy') | float(0) %}
          {{ ((act - fc) / fc * 100) | round(0) if fc >= 0.5 else 0 }}
        attributes:
          forecast_kwh: "{{ states('sensor.solar_wall_solcast_pv_forecast_home_west') | float(0) | round(2) }}"
          actual_kwh: "{{ states('sensor.sungrow_daily_energy') | float(0) | round(2) }}"
          curtailed_today: "{{ (states('sensor.output_suppressed_today') | float(0)) > 0.1 }}"


# ==========================================
# PROPORTIONAL SOLAR CURTAILMENT CONTROLS
# ==========================================
# solar_curtail_limit    : the current commanded inverter limit (0-100%)
# solar_curtail_target_kw: grid power to hold. Negative = allow that much
#                          export; 0 = zero export; positive = keep importing.
input_number:
  solar_curtail_limit:
    name: Solar Curtail Limit
    min: 0
    max: 100
    step: 1
    mode: box
    # No 'initial:' — restore last value across restarts (the loop re-derives
    # it within 20s anyway).
    unit_of_measurement: "%"
    icon: mdi:speedometer
  solar_curtail_target_kw:
    name: Solar Curtail Grid Target
    min: -1
    max: 1
    step: 0.05
    mode: box
    # No 'initial:' — HA restores the last value you set via the dashboard
    # across restarts. Setting 'initial:' here would force a reset on every
    # HA restart and clobber any change you made in the UI.
    # TUNING: target = 0 (zero export). With the 30 s grid smoothing and the
    # 0.05 kW deadband in SolarProportionalCurtail.yaml, this tracks cleanly
    # without excessive jitter. Confirmed good in operation.
    unit_of_measurement: "kW"
    icon: mdi:transmission-tower


# Manual emergency override: ON = force both inverters to 0% immediately.
# The proportional curtailment loop yields while this is ON (see its
# conditions), so the two control paths never fight the limit registers.
input_boolean:
  manual_full_curtail:
    name: Manual Full Curtail
    icon: mdi:solar-power-variant-outline
  # When ON, the Backup Reserve Safety Guard (automations/ReserveGuard.yaml)
  # will auto-lower the Powerwall reserve to release the battery if it detects
  # expensive grid import while the battery is holding usable charge. OFF =
  # alert-only. No 'initial:' so your choice persists across restarts.
  reserve_guard_auto_release:
    name: Reserve Guard Auto-Release
    icon: mdi:battery-alert-variant-outline


# ==========================================
# SMOOTHED GRID POWER (for the curtailment control loop)
# ==========================================
# CT readings jitter by tens of watts around zero. Feed the proportional
# curtailment loop a short rolling mean so noise doesn't cause limit hunting.
sensor:
  - platform: statistics
    name: "Grid Power Smoothed"
    unique_id: grid_power_smoothed
    entity_id: sensor.power_sync_grid_power
    state_characteristic: mean
    max_age:
      seconds: 30
    sampling_size: 15
  # Per-inverter daily energy:
  #   Sungrow  -> native "Daily power yields" register (sensor.sungrow_daily_energy).
  #   Fronius  -> midnight-baseline delta on the lifetime counter (defined in the
  #              template: section as sensor.fronius_energy_today). The Fronius
  #              SunSpec map exposes ONLY a lifetime accumulator (no daily
  #              register), so we replicate exactly what its LCD does:
  #              today = lifetime_now - lifetime_at_last_midnight. This is
  #              dropout-tolerant and full-accuracy (no integration error), unlike
  #              a Riemann integral, and immune to the utility_meter reset-from-
  #              zero spike that previously reported the whole ~187,000 kWh.
  # Hours that output was held below potential today (curtailment/throttle).
  # Used to invalidate the daily forecast-vs-actual health comparison: if we
  # curtailed, actual < forecast for a deliberate reason, not degradation.
  - platform: history_stats
    name: "Output Suppressed Today"
    unique_id: output_suppressed_today
    entity_id: binary_sensor.output_suppressed
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  # Clock (updates every minute) — put on a dashboard to confirm the view is
  # live. For DATA freshness (is Modbus actually flowing?), prefer a live
  # sensor's 'last-updated' secondary info on a dashboard card.
  - platform: time_date
    display_options:
      - "date_time"
      - "time"


# ==========================================
# PER-INVERTER DAILY ENERGY (for age/health comparison vs per-site forecast)
# ==========================================
# No utility_meter needed any more:
#   Sungrow uses its native self-resetting daily register.
#   Fronius uses the midnight-baseline template sensors below.
